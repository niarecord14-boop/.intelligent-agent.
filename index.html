<title>NIA Records</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: sticky left rail beside dark ledgers; home as a briefing page, warrants as level-specific slip cards, case files as tabbed folders, personnel as ID badges; the unit emblem sits faintly behind every page over a blueprint grid. Single dark look by choice. */
:root{
  --bg:#06080c;
  --surface:#0d1118;
  --surface-2:#131a24;
  --surface-3:#1a2330;
  --ink:#e7eaf1;
  --ink-2:#a0aabd;
  --ink-3:#7d879c;
  --line:#232d3d;
  --line-2:#182030;
  --brand:#3c43b0;
  --brand-text:#a3acff;
  --on-brand:#ffffff;
  --flag-red:#c8213c;
  --flag-blue:#3b3590;
  --lv-green:#5ad39a;
  --lv-green-bg:#0f2a1e;
  --lv-yellow:#f0c24a;
  --lv-yellow-bg:#2e2509;
  --lv-red:#ff7a86;
  --lv-red-bg:#3a1319;
  --danger:#ff7a86;
  --focus:#7aa2ff;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 40px rgba(0,0,0,.6);
  --font:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(rgba(130,150,190,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(130,150,190,.05) 1px,transparent 1px);background-size:44px 44px;color:var(--ink);font:15px/1.65 var(--font);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--emblem,none) center 46%/min(78vmin,640px) no-repeat;opacity:.08}
h1,h2,h3,h4,p,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand-text)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{display:inline-flex;flex:none}
.ic svg{width:1.2em;height:1.2em}
.mono{font-family:var(--mono)}
.shape{display:inline-flex;flex:none}
.shape svg{width:12px;height:12px;display:block}

/* shell */
.shell{position:relative;z-index:1;max-width:1220px;margin:0 auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:252px minmax(0,1fr);gap:24px;align-items:start}
.rail{position:sticky;top:20px;display:grid;gap:14px;min-width:0}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.emblem{width:64px;height:64px;border-radius:50%;flex:none;display:block;background:#000;box-shadow:0 0 0 1px var(--line)}
.unit{font-weight:700;font-size:15px;line-height:1.3;text-wrap:balance}
.usub{font:500 11px/1.4 var(--mono);color:var(--ink-3);letter-spacing:.06em;margin-top:2px}
.me{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-width:0}
.me-name{font-weight:600;overflow-wrap:anywhere}
.me-meta{font-size:13px;color:var(--ink-2)}
.nav{display:grid;gap:2px}
.navb{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;border-radius:3px;background:transparent;text-align:left;color:var(--ink-2);font-weight:500}
.navb:hover{background:var(--surface-2);color:var(--ink)}
.navb.on{background:var(--brand);color:var(--on-brand)}
.navb .nl{flex:1;min-width:0}
.navb .bd{font:500 12px/1 var(--mono);padding:3px 6px;border-radius:2px;background:var(--surface-3);color:var(--ink-2)}
.navb .bd.hot,.pill .bd.hot{background:var(--flag-red);color:#fff}
.navb.on .bd{background:rgba(255,255,255,.2);color:var(--on-brand)}
.tabbar{display:none}
.main{min-width:0;display:grid;gap:16px;align-content:start}
.flag{height:6px;border-radius:1px;outline:1px solid var(--line);background:linear-gradient(to right,var(--flag-red) 0 16.66%,#f3f4f6 16.66% 33.33%,var(--flag-blue) 33.33% 66.66%,#f3f4f6 66.66% 83.33%,var(--flag-red) 83.33% 100%)}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font:500 12px/1.4 var(--mono);color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.mhead h2{font-size:28px;line-height:1.25;font-weight:700;text-wrap:balance}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 220px;min-width:0;display:flex;align-items:center}
.search .ic{position:absolute;left:11px;color:var(--ink-3);pointer-events:none}
.search .in{padding-left:34px}
.legal{font:400 12px/1.6 var(--mono);color:var(--ink-3);padding-top:8px}

/* controls */
.in{width:100%;padding:9px 11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;min-width:0}
textarea.in{min-height:96px;resize:vertical}
.in::placeholder{color:var(--ink-3)}
.in.mono{font-family:var(--mono);letter-spacing:.06em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-radius:3px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:600;line-height:1.4;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.danger.solid{background:var(--danger);color:#1a0508}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.icon{padding:6px 8px}
.btn:disabled{opacity:.55;cursor:default}
.fld{display:grid;gap:5px;min-width:0}
.fld label,.lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.fld label .no{font:500 11px/1 var(--mono);color:var(--brand-text);margin-right:8px;letter-spacing:.1em}
.hint{font-size:12.5px;color:var(--ink-3)}
.err{padding:9px 12px;border:1px solid var(--danger);color:var(--danger);border-radius:3px;font-size:14px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:18px;height:18px;flex:none}

/* chips, tiles, stamps */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:2px;font-size:12.5px;font-weight:600;line-height:1.55;white-space:nowrap;border:1px solid transparent}
.chip .tag{font-weight:500;opacity:.9}
.chip.lv-green{color:var(--lv-green);background:var(--lv-green-bg);border-color:color-mix(in srgb,var(--lv-green) 40%,transparent)}
.chip.lv-yellow{color:var(--lv-yellow);background:var(--lv-yellow-bg);border-color:color-mix(in srgb,var(--lv-yellow) 40%,transparent)}
.chip.lv-red{color:var(--lv-red);background:var(--lv-red-bg);border-color:color-mix(in srgb,var(--lv-red) 40%,transparent)}
.chip.neutral{color:var(--ink-2);background:var(--surface-3);border-color:var(--line)}
.chip.brand{color:var(--brand-text);background:transparent;border-color:color-mix(in srgb,var(--brand-text) 55%,transparent)}
.chip.off{color:var(--ink-3);text-decoration:line-through;background:transparent;border-color:var(--line)}
.chip.warn{color:var(--lv-yellow);background:var(--lv-yellow-bg);border-color:color-mix(in srgb,var(--lv-yellow) 40%,transparent)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{display:grid;gap:2px;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0}
button.tile:hover{background:var(--surface-2)}
.tile[aria-pressed="true"]{outline:2px solid var(--brand-text);outline-offset:-1px}
.tile .n{font:600 30px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.tile .tl{font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.tile.lv-green .n,.tile.lv-green .tl .shape{color:var(--lv-green)}
.tile.lv-yellow .n,.tile.lv-yellow .tl .shape{color:var(--lv-yellow)}
.tile.lv-red .n,.tile.lv-red .tl .shape{color:var(--lv-red)}
.stamp{display:inline-block;font:700 12px/1 var(--mono);letter-spacing:.14em;padding:4px 8px;border:2px solid currentColor;border-radius:2px;transform:rotate(-4deg);white-space:nowrap}
.stamp.cls-secret{color:var(--lv-yellow)}
.stamp.cls-vsecret{color:var(--lv-red)}
.stamp.cls-top{color:var(--lv-red);background:var(--lv-red-bg)}
.stamp.pend{color:var(--lv-yellow)}
.stamp.rej{color:var(--lv-red)}
.lnk{font-weight:600;overflow-wrap:anywhere}

/* generic rows */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.rec{display:grid;width:100%;padding:12px 14px;gap:6px 14px;align-items:center;background:transparent;border:0;border-bottom:1px solid var(--line-2);text-align:left;color:inherit;min-width:0}
.rec:last-child{border-bottom:0}
.subj{display:block;font-weight:600;overflow-wrap:anywhere}
.reason{display:block;color:var(--ink-2);font-size:14px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ref{font:500 12px/1.5 var(--mono);color:var(--ink-3);letter-spacing:.04em;overflow-wrap:anywhere}
.c-st{font-size:12.5px;color:var(--ink-3);font-weight:600}
.empty{padding:36px 20px;text-align:center;color:var(--ink-2);display:grid;gap:6px;justify-items:center}
.empty b{color:var(--ink);font-size:16px}
.rec.k{grid-template-columns:minmax(0,1.1fr) 120px minmax(0,1fr) 190px auto;grid-template-areas:"code role note st act"}
.rec.k .c-code{grid-area:code}.rec.k .c-role{grid-area:role}.rec.k .c-note{grid-area:note}.rec.k .c-st{grid-area:st}.rec.k .c-act{grid-area:act}
.code{font:600 15px/1.4 var(--mono);letter-spacing:.08em;user-select:all;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:13px;color:var(--ink-3)}

/* home */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:6px;padding:22px}
.hero-emb{width:152px;height:152px;border-radius:50%;background:#000;box-shadow:0 0 0 1px var(--line),0 0 0 6px var(--surface-2)}
.hero-h{font-size:30px;line-height:1.2;font-weight:700;text-wrap:balance;margin-top:4px}
.hero-s{font:500 12px/1.6 var(--mono);color:var(--ink-3);letter-spacing:.1em;margin-top:2px}
.motto{margin-top:10px;color:var(--ink-2);font-size:16px;max-width:52ch}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.vcard{background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:4px;padding:16px 18px;display:grid;gap:6px;align-content:start;min-width:0}
.vcard h3{font-size:19px;line-height:1.35}
.vcard p{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2)}
.pinrow{display:grid;gap:2px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.pinrow:last-child{border-bottom:0}
.pinrow b{overflow-wrap:anywhere}

/* warrants: slip cards */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.wcard{display:grid;grid-template-rows:auto 1fr auto;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0;overflow:hidden;min-width:0;color:inherit}
.wcard:hover{border-color:var(--ink-3);background:var(--surface-2)}
.wc-top{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 12px;font-weight:700;font-size:13px}
.wc-top .lv{display:inline-flex;gap:7px;align-items:center;flex-wrap:wrap}
.wc-top .tag{font-weight:500;opacity:.9}
.wc-top .ref{color:inherit;opacity:.75}
.wcard.lv-green .wc-top{background:var(--lv-green-bg);color:var(--lv-green)}
.wcard.lv-yellow .wc-top{background:var(--lv-yellow-bg);color:var(--lv-yellow)}
.wcard.lv-red .wc-top{background:var(--lv-red-bg);color:var(--lv-red)}
.wcard.lv-red{border-color:color-mix(in srgb,var(--lv-red) 45%,var(--line))}
.wcard.closed{opacity:.55}
.wc-body{padding:12px 14px;display:grid;gap:6px;align-content:start}
.wc-subj{font-size:19px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.wc-meta{display:grid;gap:2px;font-size:13px;color:var(--ink-2)}
.wc-meta>div{display:flex;gap:6px;align-items:flex-start;overflow-wrap:anywhere}
.wc-meta .ic{margin-top:4px;color:var(--ink-3)}
.wc-chips{display:flex;gap:6px;flex-wrap:wrap}
.wc-chips .chip{white-space:normal}
.wc-foot{display:flex;justify-content:space-between;gap:8px;padding:8px 14px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--ink-3)}
.lvhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--surface-2)}
.lvhead .tx{font-size:13px;color:var(--ink-2)}
.mdyn{display:grid;gap:14px}

/* case files: folders */
.split{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:start}
.cats{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px}
.catlbl{font:500 11px/1.4 var(--mono);letter-spacing:.1em;color:var(--ink-3);padding:6px 10px 2px}
.catb{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border:0;border-radius:3px;background:transparent;text-align:left;color:var(--ink-2);font-weight:500}
.catb:hover{background:var(--surface-2)}
.catb[aria-pressed="true"]{background:var(--surface-3);color:var(--ink);font-weight:700}
.catb .bd{font:500 12px/1 var(--mono);color:var(--ink-3)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:34px 16px;padding-top:24px}
.folder{position:relative;display:grid;gap:8px;align-content:start;text-align:left;padding:16px 14px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:0 6px 6px 6px;min-width:0;color:inherit}
.folder:hover{border-color:var(--ink-3);background:var(--surface-3)}
.folder .ftab{position:absolute;left:-1px;top:-22px;height:22px;padding:0 12px;background:var(--surface-2);border:1px solid var(--line);border-bottom:0;border-radius:6px 10px 0 0;font:500 11px/21px var(--mono);color:var(--ink-2);letter-spacing:.06em}
.folder:hover .ftab{background:var(--surface-3);border-color:var(--ink-3)}
.fhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.entries{display:grid;gap:8px}
.ent{padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:var(--surface-2)}
.ent p{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}

/* personnel: badges */
.idgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.idc{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:grid;min-width:0;align-content:start}
.idc .flag{height:4px;border-radius:0;outline:0}
.idc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px 0}
.idc-tag{font:600 11px/1.4 var(--mono);letter-spacing:.14em;color:var(--ink-3)}
.idc-b{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:12px 14px 8px;align-items:start}
.avatar{width:64px;height:76px;border-radius:3px;background:var(--surface-3);border:1px solid var(--line);display:grid;place-items:center;font:700 22px/1 var(--mono);color:var(--ink-2)}
.idc-n{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.idc-r{color:var(--ink-2);font-size:13.5px}
.idc-d{display:grid;gap:2px;padding:0 14px 12px;font-size:13px;color:var(--ink-2)}
.idc-d>div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.idc-d .k{font:500 11px/1.6 var(--mono);letter-spacing:.08em;color:var(--ink-3);flex:none;min-width:58px}
.idc-c{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 14px;border-top:1px solid var(--line-2)}
.idc-c select{flex:1 1 130px;min-width:0}

/* board */
.boardtabs{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500;color:var(--ink-2)}
.pill .bd{font:500 11px/1 var(--mono);padding:2px 6px;border-radius:999px;background:var(--surface-3)}
.pill[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.posts{display:grid;gap:12px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.post h3{font-size:17px;line-height:1.4;overflow-wrap:anywhere}
.post .body{white-space:pre-wrap;overflow-wrap:anywhere}
.post .pm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-2)}
.post .pa{display:flex;gap:6px;flex-wrap:wrap}

/* setup */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0}
.sec-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.sec-h h3{font-size:16px}
.sec-h p{font-size:13.5px;color:var(--ink-2);max-width:60ch}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line-2);min-width:0}
.row:last-child{border-bottom:0}
.row .rt{min-width:0;overflow-wrap:anywhere}
.row .rt small{display:block;color:var(--ink-3);font-size:12.5px}
.sec-empty{padding:14px 16px;color:var(--ink-3);font-size:14px}
.setup{display:grid;gap:14px}
.permgroup{display:grid;gap:8px}
.perms{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}

/* modal */
.mwrap{position:fixed;inset:0;z-index:50;background:rgba(2,4,8,.72);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--ink);width:min(580px,100%);max-height:100%;overflow:auto;border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.modal.wide{width:min(720px,100%)}
.mhd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 18px 12px;border-bottom:1px solid var(--line-2)}
.mt{min-width:0}
.mhd h3{font-size:19px;line-height:1.35;overflow-wrap:anywhere}
.msub{font:500 12px/1.5 var(--mono);color:var(--ink-3);letter-spacing:.04em;margin-top:2px}
.x{border:0;background:transparent;border-radius:3px;padding:6px;color:var(--ink-2)}
.x:hover{background:var(--surface-3)}
.mform,.mbody{padding:16px 18px 18px;display:grid;gap:14px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lvpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lvopt{display:grid;gap:2px;justify-items:start;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--surface-2);min-width:0}
.lvopt b{display:flex;gap:6px;align-items:center;font-size:14px}
.lvopt small{color:var(--ink-2);font-size:12.5px}
.lvopt.lv-green b{color:var(--lv-green)}.lvopt.lv-yellow b{color:var(--lv-yellow)}.lvopt.lv-red b{color:var(--lv-red)}
.lvopt[aria-checked="true"]{outline:2px solid var(--brand-text);outline-offset:-1px;background:var(--surface-3)}
.lvopt:disabled{opacity:.4;cursor:not-allowed}
.dl{display:grid;grid-template-columns:160px minmax(0,1fr);gap:8px 14px}
.dl dt{font-size:13px;color:var(--ink-3);font-weight:600}
.dl dd{white-space:pre-wrap;overflow-wrap:anywhere}
.log{display:grid;gap:4px;font:400 12.5px/1.5 var(--mono);color:var(--ink-2)}
.divider{height:1px;background:var(--line-2);border:0;margin:0}
.verify{display:grid;gap:5px;padding:12px;border:1px dashed var(--line);border-radius:3px;background:var(--surface-2)}
.dhead{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* gate */
.gate{position:relative;z-index:1;max-width:1020px;margin:0 auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:22px 36px;align-items:start}
.classbar{grid-column:1/-1;display:flex;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;padding:6px 12px;background:var(--flag-red);color:#fff;font:600 12px/1.6 var(--mono);letter-spacing:.14em;border-radius:2px}
.gate-brand{display:grid;gap:16px;justify-items:start;align-content:start}
.gate-brand .emblem{width:132px;height:132px}
.gate-brand h1{font-size:34px;line-height:1.2;font-weight:700;text-wrap:balance}
.gate-brand p{color:var(--ink-2);max-width:44ch}
.warnbox{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid color-mix(in srgb,var(--lv-yellow) 50%,var(--line));background:var(--lv-yellow-bg);color:var(--lv-yellow);border-radius:3px;font-size:13px;max-width:46ch}
.warnbox b{font:700 12px/1.6 var(--mono);letter-spacing:.12em;display:block}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:grid;gap:14px;box-shadow:var(--shadow);min-width:0}
.gate-card h2{font-size:20px}
.lockov{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:rgba(20,0,4,.88);animation:laflash 1s steps(2,end) infinite}
.lockbox{width:min(440px,100%);background:var(--surface);border:2px solid var(--danger);border-radius:6px;padding:0 20px 22px;display:grid;gap:12px;justify-items:center;text-align:center;box-shadow:0 0 60px rgba(255,60,80,.45);overflow:hidden}
.la-stripe{height:14px;margin:0 -22px;width:calc(100% + 44px);background:repeating-linear-gradient(-45deg,var(--danger) 0 14px,#1a0508 14px 28px)}
.la-em{position:relative;margin-top:10px;animation:lashake .5s linear infinite}
.la-em img{display:block;width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(255,60,80,.7))}
.la-bang{position:absolute;right:-14px;bottom:-6px;width:44px;height:44px;border-radius:50%;background:var(--danger);color:#1a0508;font:800 30px/44px var(--mono);border:3px solid #1a0508}
.lockbox h2{font-size:22px;color:var(--danger)}
.la-sub{font:700 12px/1.4 var(--mono);letter-spacing:.14em;color:var(--danger)}
.lockbox p{color:var(--ink-2)}
#wm{position:fixed;inset:0;z-index:150;pointer-events:none;background:var(--ink);opacity:.07;-webkit-mask-size:300px 190px;mask-size:300px 190px;-webkit-mask-repeat:repeat;mask-repeat:repeat}
@keyframes lapulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.lockov.warn{animation:none;background:rgba(40,20,0,.88)}
.lockov.warn .lockbox{border-color:var(--warn,#e0a020);box-shadow:0 0 50px rgba(255,170,0,.4)}
.lockov.warn h2,.lockov.warn .la-sub{color:var(--warn,#e0a020)}
.lockov.warn .la-stripe{background:repeating-linear-gradient(-45deg,#e0a020 0 14px,#1a1000 14px 28px)}
.lockov.warn .la-bang{background:#e0a020}
.la-bang{animation:lapulse .7s ease-in-out infinite}
.la-stripe{background-size:56px 100%;animation:lastripe 1s linear infinite}
@keyframes lastripe{to{background-position:56px 0}}
@keyframes lashake{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-5px,2px) rotate(-3deg)}40%{transform:translate(5px,-2px) rotate(3deg)}60%{transform:translate(-4px,-2px) rotate(-2deg)}80%{transform:translate(4px,2px) rotate(2deg)}}

.nid .n-h{display:flex;align-items:center;justify-content:center;gap:12px}
.nid .n-h .hd-em{width:38px;height:38px;border-radius:50%;background:#000;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.nid .n-h .x{position:static;margin-left:auto}
.nid .n-bar{width:55%;height:28px}
.nid.land .n-rt{align-content:start}
.cardgrid{grid-template-columns:repeat(auto-fill,minmax(min(520px,100%),520px))!important;justify-content:center;gap:24px}
.cardslot{width:min(520px,100%)}
.idcard.nid.static{width:min(520px,100%)}
.rk-h{display:flex;align-items:center;gap:12px;padding:6px 2px;border-bottom:1px solid var(--line)}
.rk-h h3{font-size:17px}
.rk-h .bd{font:500 12px/1 var(--mono);padding:3px 7px;border-radius:2px;background:var(--surface-3);color:var(--ink-2)}
.rk-sec{display:grid;gap:14px}

.inspwrap{position:relative;z-index:1;margin:-4px auto 0;width:100%;max-width:520px}
.inspwrap.feed{transition:transform .8s cubic-bezier(.3,.7,.3,1),clip-path .8s cubic-bezier(.3,.7,.3,1),margin-bottom .8s cubic-bezier(.3,.7,.3,1)}
.modal .machine{margin:0 auto;max-width:560px}

.vault{background:linear-gradient(180deg,#101828,#0a0f1a);border:1px solid #2b3a5a;border-radius:14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.06),0 20px 40px rgba(0,0,0,.5);overflow:hidden}
.vault-h{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid #1d2a44;font:600 12px/1.4 var(--mono);letter-spacing:.14em;color:#9db0ff}
.vault-h .note{margin-left:auto}
.vault-b{padding:22px 14px 14px;display:grid;justify-items:center;background:repeating-linear-gradient(90deg,rgba(255,255,255,.015) 0 2px,transparent 2px 22px)}
.vres{border-radius:8px;padding:12px 14px;display:grid;gap:6px;border:1px solid}
.vres.ok{border-color:var(--lv-green);background:var(--lv-green-bg)}
.vres.bad{border-color:var(--lv-red);background:var(--lv-red-bg)}
.vres .vh{font:700 13px/1.4 var(--mono);letter-spacing:.14em}
.vres.ok .vh{color:var(--lv-green)}.vres.bad .vh{color:var(--lv-red)}
</style>

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ===== ตัวเชื่อมฐานข้อมูล: ทำให้เว็บนี้ทำงานนอก Claude ด้วย Firebase (ไม่ทำงานเมื่อเปิดภายใน Claude) ===== */
(function(){
  if(window.claude&&typeof window.claude.use==='function')return;
  const cfg=window.NIA_FIREBASE||{};
  const owners=(window.NIA_OWNER_EMAILS||[]).map(e=>String(e).trim().toLowerCase()).filter(Boolean);
  let ready=null;
  function init(){
    if(ready)return ready;
    ready=(async()=>{
      if(typeof firebase==='undefined'||!cfg.apiKey||/YOUR_|ใส่/.test(cfg.apiKey))throw new Error('config');
      firebase.initializeApp(cfg);
      const auth=firebase.auth(),fs=firebase.firestore();
      fs.settings({ignoreUndefinedProperties:true});
      const user=await new Promise((res,rej)=>{const off=auth.onAuthStateChanged(u=>{off();res(u);},rej);});
      let u=user;
      if(!u){u=(await auth.signInAnonymously()).user;}
      return {auth,fs,u};
    })();
    return ready;
  }
  const isOwnerUser=u=>!!u&&!u.isAnonymous&&!!u.email&&u.emailVerified!==false&&owners.includes(u.email.toLowerCase());
  async function ownerButton(){
    try{
      const {auth,u}=await init();
      const b=document.createElement('button');
      b.type='button';
      b.textContent=isOwnerUser(u)?'เจ้าของระบบ · ออกจากระบบ':'เจ้าของระบบ · เข้าสู่ระบบด้วย Google';
      b.style.cssText='position:fixed;left:8px;bottom:8px;z-index:160;font:600 11px/1.2 ui-monospace,Menlo,monospace;padding:7px 10px;border-radius:5px;border:1px solid rgba(255,255,255,.18);background:rgba(10,14,24,.85);color:#9aa6c4;cursor:pointer;opacity:.75';
      b.onmouseenter=()=>b.style.opacity=1;b.onmouseleave=()=>b.style.opacity=.75;
      b.onclick=async()=>{
        try{
          if(!u.isAnonymous){await auth.signOut();}
          else{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());}
          location.reload();
        }catch(e){alert('เข้าสู่ระบบไม่สำเร็จ: '+(e&&e.message||e));}
      };
      document.body.appendChild(b);
    }catch(e){}
  }
  window.addEventListener('DOMContentLoaded',()=>setTimeout(ownerButton,0));

  const wrapSnap=s=>({exists:s.exists,id:s.id,data:()=>s.data()});
  const wrapQ=(q)=>({
    orderBy:(f,d)=>wrapQ(q.orderBy(f,d)),
    limit:n=>wrapQ(q.limit(n)),
    onSnapshot:(ok,err)=>q.onSnapshot(s=>ok({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),size:s.size}),e=>err&&err(e)),
    doc:id=>wrapDoc(id===undefined?q.doc():q.doc(id)),
    get:async()=>{const s=await q.get();return {docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))};}
  });
  let FS=null;
  const wrapDoc=r=>({
    id:r.id,
    acquire:async({holder,ttlMs})=>{
      const lr=FS.doc('leases/'+r.path.replace(/\//g,'_'));
      return FS.runTransaction(async t=>{const s=await t.get(lr);const now=Date.now();
        if(s.exists&&s.data().exp>now&&s.data().holder!==holder)return {acquired:false};
        t.set(lr,{holder,exp:now+(ttlMs||10000)});return {acquired:true};});
    },
    get:async()=>wrapSnap(await r.get()),
    set:async d=>{await r.set(d);},
    update:async d=>{await r.update(d);},
    delete:async()=>{await r.delete();},
    onSnapshot:(ok,err)=>r.onSnapshot(s=>ok(wrapSnap(s)),e=>err&&err(e))
  });
  function makeDb(fs){
    FS=fs;
    return {
      doc:p=>wrapDoc(fs.doc(p)),
      collection:n=>wrapQ(fs.collection(n))
    };
  }
  window.claude={
    use:async name=>{
      if(name==='db'){const {fs}=await init();return makeDb(fs);}
      if(name==='user'){
        const {u}=await init();
        return {id:async()=>u.uid,isOwner:async()=>isOwnerUser(u),canEdit:async()=>false,can:async()=>true};
      }
      if(name==='downloads'){
        return {save:async({filename,data})=>{
          const blob=data instanceof Blob?data:new Blob([data]);
          const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;
          document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
          return {status:'saved'};}};
      }
      return null;
    }
  };
})();
</script>

/* ---------- helpers ---------- */
function h(tag,props,...kids){
  const el=document.createElement(tag);
  if(props){
    for(const k of Object.keys(props)){
      const v=props[k];
      if(v==null||v===false) continue;
      if(k==='class') el.className=v;
      else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
      else if(k==='value') el.value=v;
      else if(k==='hidden'||k==='disabled'||k==='checked') el[k]=!!v;
      else el.setAttribute(k,v===true?'':v);
    }
  }
  for(const kid of kids.flat(Infinity)){
    if(kid==null||kid===false) continue;
    el.append(kid.nodeType?kid:document.createTextNode(String(kid)));
  }
  return el;
}

async function hashCode(uid,code){
  if(!(window.crypto&&crypto.subtle))throw new UserError('เบราว์เซอร์นี้ไม่รองรับการเข้ารหัสรหัสประจำตัว ลองเปิดด้วยเบราว์เซอร์อื่น');
  const d=new TextEncoder().encode('nia|'+uid+'|'+normCode(code));
  const b=await crypto.subtle.digest('SHA-256',d);
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

async function copyText(txt){try{await navigator.clipboard.writeText(txt);toast('คัดลอกแล้ว');}catch(e){toast('คัดลอกอัตโนมัติไม่ได้ กดที่รหัสเพื่อเลือกทั้งหมดแล้วคัดลอกเอง');}}
function defaultGroups(ranks){
  const cr=ranks.find(r=>String(r.name).trim()==='สภาระดับสูง');
  const dr=ranks.find(r=>/^ผู้อำนว[ยจ]การ/.test(String(r.name).trim()));
  const g=[{id:'g_cmd',name:'ผู้บริหารและผู้ดูแล',ranks:[],roles:['owner','admin']}];
  if(cr)g.push({id:'g_council',name:'สภาระดับสูง',ranks:[cr.id],roles:[]});
  if(dr)g.push({id:'g_dir',name:'ผู้อำนวยการ',ranks:[dr.id],roles:[]});
  return g;
}
function mergeCfg(st){
  const d=clone(DEFAULT_CFG);if(!st){d.groups=defaultGroups(d.ranks);return d;}
  const out=Object.assign({},d,st);
  out.unit=Object.assign({},d.unit,st.unit||{});
  out.home=Object.assign({},d.home,st.home||{});
  out.sec=Object.assign({},d.sec,st.sec||{});
  out.card=Object.assign({},d.card,st.card||{});
  out.levels={};
  for(const k of LV){
    const sl=(st.levels||{})[k]||{};
    out.levels[k]=Object.assign({},d.levels[k],sl);
    if(!Array.isArray(out.levels[k].fields))out.levels[k].fields=d.levels[k].fields;
  }
  for(const k of ['ranks','categories','boards','warrantFields','fileFields'])if(!Array.isArray(out[k]))out[k]=d[k];
  if(!out.ranks.length)out.ranks=d.ranks;
  if(!Array.isArray(out.groups))out.groups=defaultGroups(out.ranks);
  let roles=Array.isArray(st.roles)&&st.roles.length?st.roles:d.roles;
  const storedRoles=Array.isArray(st.roles)&&st.roles.length>0;
  if(!roles.some(r=>r.id==='owner'))roles=[d.roles[0]].concat(roles);
  roles=roles.filter(r=>r.id==='owner').concat(roles.filter(r=>r.id!=='owner'));
  out.roles=roles.map(r=>{if(r.id==='owner')return Object.assign({},r,{locked:true});if(r.id==='admin'){const p=r.permsSet?(r.perms||{}):Object.fromEntries(PERMS.map(x=>[x.k,true]));return Object.assign({},r,{locked:true,perms:p});}return r;});
  return out;
}
let cfgQueue=Promise.resolve();
function saveCfg(patch){
  S.cfg=Object.assign({},S.cfg,patch);S.cfgStored=true;
  const snapshot=clone(S.cfg);
  cfgQueue=cfgQueue.then(()=>S.db.doc('config/main').set(snapshot)).catch(e=>toast(errText(e)));
  scheduleRender();
  return cfgQueue;
}

/* form building */
function inp(id,props){return h('input',Object.assign({id,class:'in'},props||{}));}
function sel(id,opts,value,onchange,cls){
  const s=h('select',{id,class:cls||'in'});
  for(const o of opts)s.append(h('option',{value:o[0]},o[1]));
  s.value=value;
  if(onchange)s.addEventListener('change',()=>onchange(s.value));
  return s;
}
function field(id,label,control,hint){return h('div',{class:'fld'},h('label',{for:id},label),control,hint?h('p',{class:'hint'},hint):null);}
function cfControl(prefix,f,val){
  const id=prefix+f.id;
  if(f.type==='longtext')return h('textarea',{id,class:'in',rows:3,value:val||''});
  if(f.type==='select')return sel(id,[['','— เลือก —']].concat((f.options||[]).map(o=>[o,o])),val||'');
  return h('input',{id,class:'in',type:f.type==='date'?'date':f.type==='number'?'number':'text',value:val||''});
}
function cfFields(prefix,fields,vals){return fields.map(f=>field(prefix+f.id,f.label+(f.required?' *':''),cfControl(prefix,f,(vals||{})[f.id])));}
function dl(rows){return h('dl',{class:'dl'},rows.filter(r=>r[1]!=null&&r[1]!=='').flatMap(r=>[h('dt',{},r[0]),h('dd',{},r[1])]));}
function searchBox(id,value,onInput,ph){
  const i=h('input',{id,class:'in',type:'search',placeholder:ph,value:value||'',autocomplete:'off','aria-label':ph});
  i.addEventListener('input',()=>onInput(i.value));
  return h('label',{class:'search'},icon('search'),i);
}
function levelChip(k){
  const L=S.cfg.levels[k]||{name:k,tag:''};
  return h('span',{class:'chip lv-'+k},shape(k),h('span',{},L.name,h('span',{class:'tag'},' · '+L.tag)));
}
function emptyBox(title,text,btn){return h('div',{class:'empty'},h('b',{},title),h('p',{},text),btn||null);}
const defsOf=k=>((S.cfg.levels[k]&&S.cfg.levels[k].fields)||[]).concat(S.cfg.warrantFields);

/* modals */
let modals=[];
function openModal(o){
  const prev=document.activeElement;
  const m={};
  const wrap=h('div',{class:'mwrap'});
  const box=h('div',{class:'modal'+(o.wide?' wide':''),role:'dialog','aria-modal':'true','aria-label':o.title},
    h('div',{class:'mhd'},h('div',{class:'mt'},h('h3',{},o.title),o.sub?h('div',{class:'msub'},o.sub):null),
      h('button',{type:'button',class:'x','aria-label':'ปิด',onclick:()=>m.close()},icon('x'))),
    o.body);
  wrap.append(box);
  wrap.addEventListener('mousedown',e=>{if(e.target===wrap)m.close();});
  m.close=function(res){
    if(!wrap.isConnected)return;
    wrap.remove();modals=modals.filter(x=>x!==m);
    try{if(prev&&prev.isConnected&&prev.focus)prev.focus();}catch(e){}
    if(o.onClose)o.onClose(res);
  };
  $('#modal-root').append(wrap);modals.push(m);
  setTimeout(()=>{const f=box.querySelector('input:not([type=hidden]):not([type=checkbox]),textarea,select')||box.querySelector('.btn');if(f)f.focus();},0);
  return m;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modals.length)modals[modals.length-1].close();});
function formModal(o){
  const err=h('div',{class:'err',role:'alert',hidden:true});
  const submit=h('button',{type:'submit',class:'btn '+(o.danger?'danger solid':'primary')},o.submitText||'บันทึก');
  const cancel=h('button',{type:'button',class:'btn',onclick:()=>m.close()},'ยกเลิก');
  const form=h('form',{class:'mform',novalidate:true},o.fields||[],err,h('div',{class:'mfoot'},cancel,submit));
  form.addEventListener('submit',async ev=>{
    ev.preventDefault();if(submit.disabled)return;
    err.hidden=true;submit.disabled=true;
    try{await o.onSubmit();m.close(true);}
    catch(e){err.textContent=(e instanceof UserError)?e.message:errText(e);err.hidden=false;submit.disabled=false;}
  });
  const m=openModal({title:o.title,sub:o.sub,body:form,wide:o.wide,onClose:o.onClose});
  m.submitBtn=submit;
  return m;
}
function confirmBox(title,text,okText,danger){
  return new Promise(res=>{
    let ok=false;
    formModal({title,fields:[h('p',{},text)],submitText:okText||'ยืนยัน',danger:danger!==false,onSubmit:async()=>{ok=true;},onClose:()=>res(ok)});
  });
}
function askVerify(title){
  return new Promise(res=>{
    let ok=false;
    const i=inp('v-code',{type:'password',autocomplete:'off',spellcheck:'false'});i.classList.add('mono');

  });

function bindForm(form,errEl,btn,fn){

    catch(e){errEl.textContent=(e instanceof UserError)?e.message:errText(e);errEl.hidden=false;btn.disabled=false;}

function checkPerson(name,ageRaw){
  if(!/^[A-Za-z0-9_]{3,20}$/.test(name))throw new UserError('ชื่อ Roblox ต้องเป็นตัวอักษรอังกฤษ ตัวเลข หรือขีดล่าง 3–20 ตัว');
  const age=parseAge(ageRaw);
  if(age==null)throw new UserError('ใส่อายุเป็นตัวเลข 5–99');
  if(nameTaken(name))throw new UserError('ชื่อ Roblox นี้สมัครไว้แล้ว');
  return {age};
}
async function doRegister(){
  const reg=S.reg;const name=reg.name.trim();const code=normCode(reg.code);

  if(normCode(reg.code2)!==code)throw new UserError('รหัสที่ยืนยันไม่ตรงกัน');
  const codeHash=await hashCode(S.uid,code);

  const lease=await ref.acquire({holder:S.uid,ttlMs:10000});

  if((await ref.get()).exists)throw new UserError('รหัสนี้มีคนใช้แล้ว ตั้งรหัสอื่น');

  const rankId='';

  await S.db.doc('members/'+S.uid).set(member);

function renderScan(){

  const inner=buildCardEl(m,null);inner.classList.add('static');
  const card=h('div',{class:'rotwrap'},inner);

  let done=false,sx=0,sy=0,dx=0,dy=0,drag=false;
  function slitBottom(){return mouth.getBoundingClientRect().bottom-14;}
  function over(){const a=card.getBoundingClientRect(),b=mouth.getBoundingClientRect();const cx=a.left+a.width/2;return cx>b.left+20&&cx<b.right-20&&a.top<=slitBottom()-70;}
  function clip(){const a=card.getBoundingClientRect(),mb=mouth.getBoundingClientRect();const cx=a.left+a.width/2;const inside=cx>mb.left&&cx<mb.right;const x=inside?Math.max(0,slitBottom()-a.top):0;card.style.clipPath=x>0?'inset('+x+'px 0 0 0)':'';}
  async function doScan(){
    if(done)return;done=true;
    const a=card.getBoundingClientRect(),b=mouth.getBoundingClientRect();

    const HEAD=58;

function pickPhoto(id){

function readCF(prefix,fields){

  return h('div',{class:'setup'},pills,note,body);

async function sha256hex(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function cardToken(id,m){return (await sha256hex('nia-card|'+id+'|'+(m.unitId||'')+'|'+m.name+'|'+m.rankId+'|'+roleIdOf(m)+'|'+(m.codeHash||''))).slice(0,16).toUpperCase();}
const fmtTok=t=>t.replace(/(.{4})/g,'$1-').replace(/-$/,'');
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function pngAddChunk(buf,keyword,text){
  const u=new Uint8Array(buf);const kw=new TextEncoder().encode(keyword+'\0'+text);
  const type=new Uint8Array([116,69,88,116]);
  const body=new Uint8Array(4+kw.length);body.set(type,0);body.set(kw,4);
  const chunk=new Uint8Array(12+kw.length);const dv=new DataView(chunk.buffer);
  dv.setUint32(0,kw.length);chunk.set(body,4);dv.setUint32(8+kw.length,crc32(body));
  const at=33;const out=new Uint8Array(u.length+chunk.length);
  out.set(u.subarray(0,at),0);out.set(chunk,at);out.set(u.subarray(at),at+chunk.length);return out;
}
function pngReadChunk(buf,keyword){
  const u=new Uint8Array(buf);const sig=[137,80,78,71,13,10,26,10];
  if(u.length<33||sig.some((v,i)=>u[i]!==v))return null;
  const dv=new DataView(buf);let p=8;
  while(p+12<=u.length){
    const len=dv.getUint32(p);const type=String.fromCharCode(u[p+4],u[p+5],u[p+6],u[p+7]);
    if(type==='tEXt'){
      const data=u.subarray(p+8,p+8+len);const z=data.indexOf(0);
      if(z>0&&new TextDecoder().decode(data.subarray(0,z))===keyword)return new TextDecoder().decode(data.subarray(z+1));
    }
    if(type==='IEND')break;
    p+=12+len;
  }
  return null;
}

async function verifyCardFile(file){
  if(!file)return;
  if(file.size>8*1024*1024)return {ok:false,msg:'ไฟล์ใหญ่เกินไป ใช้รูปบัตรที่ดาวน์โหลดจากระบบ'};
  const buf=await file.arrayBuffer();
  const raw=pngReadChunk(buf,'NIA-CARD');
  if(!raw)return {ok:false,msg:'ไม่พบข้อมูลยืนยันในรูปนี้ ต้องเป็นไฟล์ PNG ต้นฉบับจากระบบ รูปที่ถูกแคปหน้าจอ ตัดต่อ หรือบีบอัดจะใช้ไม่ได้'};
  let d;try{d=JSON.parse(atob(raw));}catch(e){return {ok:false,msg:'ข้อมูลยืนยันในรูปเสียหาย ไม่ใช่บัตรที่ถูกต้อง'};}
  if(!d||d.v!==1||!d.u||!d.t)return {ok:false,msg:'รูปแบบข้อมูลยืนยันไม่ถูกต้อง'};
  const m=S.members.get(d.u);
  if(!m)return {ok:false,msg:'ไม่พบเจ้าของบัตรในระบบ บัตรนี้อาจถูกนำออกจากหน่วยแล้ว'};
  const t=await cardToken(d.u,m);
  if(t!==d.t)return {ok:false,id:d.u,msg:'บัตรไม่ตรงกับข้อมูลปัจจุบันของ '+m.name+' อาจเป็นบัตรเก่า (ยศ ตำแหน่ง เลขประจำตัว หรือรหัสถูกเปลี่ยนแล้ว) หรือถูกแก้ไข'};
  return {ok:true,id:d.u,msg:'บัตรถูกต้อง ตรงกับข้อมูลปัจจุบันในระบบ'};
}
async function verifyToken(raw){
  const t=String(raw||'').toUpperCase().replace(/[^A-F0-9]/g,'');
  if(t.length!==16)return {ok:false,msg:'รหัสยืนยันต้องมี 16 ตัว (ตัวเลขและ A–F) ตามที่พิมพ์บนบัตร'};
  for(const [id,m] of S.members){if((await cardToken(id,m))===t)return {ok:true,id,msg:'รหัสยืนยันถูกต้อง ตรงกับข้อมูลปัจจุบันในระบบ'};}
  return {ok:false,msg:'ไม่พบรหัสยืนยันนี้ในระบบ บัตรอาจเก่า ถูกแก้ไข หรือไม่ใช่บัตรของหน่วย'};
}

      S.f.kfilter='all';

    }
  });
}

    h('section',{class:'sec'},h('div',{class:'sec-h'},h('div',{},h('h3',{},'หน้าหลักและชื่อหน่วย'),h('p',{},'แก้ชื่อหน่วย คำขวัญ วิสัยทัศน์ และพันธกิจได้ที่หน้าหลัก'))),h('div',{class:'row'},h('div',{class:'rt'},cfg.unit.name,h('small',{},cfg.unit.sub)),h('button',{type:'button',class:'btn sm',onclick:()=>{S.view='home';render();window.scrollTo(0,0);}},icon('arrow'),'ไปหน้าหลัก'))),
    roleList(),
    groupList(),
    section('บัตรประจำตัว','บัตรที่เลื่อนออกมาหลังยืนยันรหัส แก้หัวบัตรและข้อมูลที่แสดงได้ที่นี่ ส่วนรูปถ่ายใส่ได้เฉพาะผู้ที่มีสิทธิ์จัดการกำลังพล',null,
      h('div',{class:'row'},h('div',{class:'rt'},cfg.card.title,h('small',{},cfg.card.sub)),h('button',{type:'button',class:'btn sm',onclick:openCardForm},icon('edit'),'แก้ไขบัตร'))),
    section('บันทึกรหัสประจำตัว','รหัสที่สมาชิกใช้สมัครถูกบันทึกไว้ในหน้า “รหัสเข้าระบบ” เห็นได้เฉพาะผู้มีสิทธิ์จัดการรหัส และเห็นเฉพาะรหัสของยศเท่ากับหรือต่ำกว่าตัวเอง',null,
      h('div',{class:'row'},h('div',{class:'rt'},'แสดงรหัสที่ใช้แล้ว',h('small',{},cfg.sec.codeLog?'เปิด: ผู้มีสิทธิ์เห็นข้อความรหัสของสมาชิกตามลำดับยศ':'ปิด: รหัสที่ใช้แล้วถูกปิดบัง มีเฉพาะเจ้าของระบบที่เห็น')),
        h('button',{type:'button',class:'btn sm',onclick:()=>saveCfg({sec:{codeLog:!cfg.sec.codeLog}})},cfg.sec.codeLog?'ปิดการแสดง':'เปิดการแสดง'))),
    nameList({key:'ranks',title:'ยศ',desc:'เรียงจากยศสูงสุดลงมา ผู้ที่ยศต่ำกว่าจะไม่เห็นรหัสของยศที่สูงกว่า และจัดการผู้ที่ยศสูงกว่าไม่ได้ ยศใช้แสดงตำแหน่ง ส่วนสิทธิ์การใช้งานกำหนดที่บทบาท',label:'ชื่อยศ',addTitle:'เพิ่มยศ',addText:'เพิ่มยศ',keepOne:true,
      usage:id=>[...S.members.values()].filter(m=>m.rankId===id).length,usageMsg:'ยังมีสมาชิกใช้ยศนี้อยู่ ย้ายสมาชิกไปยศอื่นก่อน',
      can:it=>S.founder||rankIdx(it.id)>myRankIdx(),
      sub:it=>{const n=Object.values(it.perms||{}).filter(Boolean).length;return n?n+' สิทธิ์เพิ่มเติมของยศนี้':'ยังไม่ได้ให้สิทธิ์เพิ่มเติม';},
      extra:it=>iconBtn('key','ตั้งสิทธิ์ของยศ '+it.name,()=>openRankPerms(it))}),
    levels,
    lvFields,
    keyed('warrantFields','ช่องข้อมูลร่วมของหมายทุกระดับ','ช่องที่ต้องการให้ปรากฏในหมายทั้งสามสี'),
    nameList({key:'categories',title:'ลิ้นชักแฟ้ม (หมวดหมู่)',desc:'ลิ้นชักสำหรับจัดแฟ้มคดีให้เป็นระเบียบ',label:'ชื่อลิ้นชัก',addTitle:'เพิ่มลิ้นชัก',addText:'เพิ่มลิ้นชัก',
      usage:id=>S.files.filter(f=>f.cat===id).length,usageMsg:'ยังมีแฟ้มคดีในลิ้นชักนี้ ย้ายหรือลบแฟ้มก่อน'}),
    keyed('fileFields','ช่องข้อมูลของแฟ้มคดี','ช่องเพิ่มเติมในฟอร์มแฟ้มคดี ชุดเริ่มต้นเป็นการประเมินแหล่งข่าวและข่าวแบบงานข่าวกรองทหาร'),
    nameList({key:'boards',title:'แผนกบนบอร์ดบริหาร',desc:'แต่ละแผนกมีบอร์ดประกาศของตัวเอง',label:'ชื่อแผนก',addTitle:'เพิ่มแผนก',addText:'เพิ่มแผนก',
      usage:id=>S.posts.filter(p=>p.board===id).length,usageMsg:'ยังมีประกาศในแผนกนี้ ลบประกาศก่อน'}));
}

const VIEWS={
  home:{label:'หน้าหลัก',en:'HEADQUARTERS',toolbar:tbHome,list:lsHome},
  warrants:{label:'ทะเบียนหมาย',en:'WARRANT REGISTER',toolbar:tbWarrants,list:lsWarrants},
  files:{label:'แฟ้มคดี',en:'CASE FILES',toolbar:tbFiles,list:lsFiles},
  board:{label:'บอร์ดบริหาร',en:'COMMAND BOARD',toolbar:tbBoard,list:lsBoard},
  members:{label:'กำลังพล',en:'PERSONNEL',toolbar:null,list:lsMembers},
  vault:{label:'บัตรประจำตัว',en:'MY ID CARD',toolbar:null,list:lsVault},
  cards:{label:'เช็คข้อมูลบัตร',en:'CARD VERIFICATION',toolbar:null,list:lsCards},
  codes:{label:'รหัสเข้าระบบ',en:'ACCESS CODES',toolbar:tbCodes,list:lsCodes},
  setup:{label:'ตั้งค่าระบบ',en:'SYSTEM SETUP',toolbar:null,list:lsSetup}
};

/* ---------- render control ---------- */
const app=document.getElementById('app');
let wmName=null;
function updateWM(){
  const m=S.loaded&&S.loaded.members?curMe():null;
  const nm=m&&m.name?String(m.name):'';
  if(nm===wmName)return; wmName=nm;
  let el=document.getElementById('wm');
  if(!nm){if(el)el.remove();return;}
  if(!el){el=document.createElement('div');el.id='wm';el.setAttribute('aria-hidden','true');document.body.appendChild(el);}
  const esc=nm.replace(/[&<>"']/g,'');
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="300" height="190"><text x="150" y="95" text-anchor="middle" transform="rotate(-28 150 95)" font-family="monospace" font-weight="700" font-size="22" letter-spacing="2" fill="#000">'+esc+'</text></svg>';
  const u='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
  el.style.webkitMaskImage=u;el.style.maskImage=u;
}
function render(){updateWM();return render0();}
function render0(){
  if(S.fatal)return renderGate('fatal');
  if(!S.loaded.cfg||!S.loaded.members)return renderGate('loading');
  const me=curMe();
  if(!me)return renderGate('register');
  const st=me.status||'active';
  if(st==='pending')return renderGate('pending');
  if(st==='rejected')return renderGate('rejected');
  if(st==='suspended')return renderGate('suspended');
  if(S.owner&&st==='active'&&roleIdOf(me)!=='owner'&&!S.upgOwner){S.upgOwner=true;S.db.doc('members/'+S.uid).update({roleId:'owner'}).catch(()=>{});me.roleId='owner';}
  if(me.locked)return renderGate('locked');
  if(!S.unlocked&&me.codeHash)return renderGate('unlock');
  if(allow('c_manage')||allow('m_manage'))ensureCodesSub();
  renderShell(me);
  if(S.cardPending){S.cardPending=false;showIdCard(me,true);}
}
const isField=a=>!!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&app.contains(a);
function safeRender(){
  const a=document.activeElement;
  if(isField(a)){
    if(a.closest('#toolbar')){if(S.shell)renderList();return;}
    S.pending=true;return;
  }
  S.pending=false;render();
}
function forceRender(){const a=document.activeElement;if(isField(a))a.blur();S.pending=false;render();}
let rt=null;
function scheduleRender(){clearTimeout(rt);rt=setTimeout(safeRender,30);}
app.addEventListener('focusout',()=>{setTimeout(()=>{if(S.pending&&!isField(document.activeElement))safeRender();},0);});

/* ---------- boot ---------- */
function onSubErr(e,key){
  if(e&&e.code==='revoked'){S.fatal='สิทธิ์เข้าถึงหน้านี้ถูกเพิกถอน';}
  if(key)S.loaded[key]=true;
  scheduleRender();
}
async function boot(){
  render();
  if(!window.claude||typeof window.claude.use!=='function'){S.fatal='โหลดระบบฐานข้อมูลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต และไฟล์ firebase-config.js';render();return;}
  let db=null,user=null;
  try{db=await window.claude.use('db');user=await window.claude.use('user');}catch(e){}
  if(!db){S.fatal='เชื่อมต่อ Firebase ไม่ได้ ตรวจสอบค่าใน firebase-config.js, การเปิด Anonymous Auth และกฎของ Firestore';render();return;}
  S.db=db;S.user=user;
  try{S.uid=user?await user.id():null;}catch(e){S.uid=null;}
  if(!S.uid){S.fatal='เข้าสู่ระบบแบบไม่ระบุตัวตนไม่สำเร็จ เปิด Anonymous ใน Firebase Authentication ก่อน';render();return;}
  try{S.dl=await window.claude.use('downloads');}catch(e){S.dl=null;}
  try{const cw=await user.can('data.write');S.canWrite=cw!==false;}catch(e){}
  try{S.owner=!!(await user.isOwner());}catch(e){}
  try{S.founder=S.owner||!!(await user.canEdit());}catch(e){}
  const h0=(location.hash||'').replace('#','');
  if(['home','vault','warrants','files','board','members','cards','codes','setup'].includes(h0))S.view=h0;
  db.doc('config/main').onSnapshot(snap=>{S.cfgStored=snap.exists;S.cfg=mergeCfg(snap.exists?snap.data():null);S.loaded.cfg=true;scheduleRender();},e=>onSubErr(e,'cfg'));
  db.collection('members').onSnapshot(snap=>{const nx=new Map(snap.docs.map(d=>[d.id,d.data()]));if(S.loaded.members&&allow('m_manage')){for(const [id,m] of nx){const o=S.members.get(id);if(m.locked&&!(o&&o.locked)&&id!==S.uid)toast('แจ้งเตือน: '+m.name+' กรอกรหัสผิด 3 ครั้ง บัญชีถูกล็อก รอปลดล็อก');}}S.members=nx;S.loaded.members=true;scheduleRender();},e=>onSubErr(e,'members'));
  db.collection('warrants').orderBy('createdAt','desc').limit(500).onSnapshot(snap=>{S.warrants=snap.docs.map(d=>Object.assign({id:d.id},d.data()));scheduleRender();},e=>onSubErr(e));
  db.collection('files').orderBy('createdAt','desc').limit(500).onSnapshot(snap=>{S.files=snap.docs.map(d=>Object.assign({id:d.id},d.data()));scheduleRender();},e=>onSubErr(e));
  db.collection('posts').orderBy('createdAt','desc').limit(300).onSnapshot(snap=>{S.posts=snap.docs.map(d=>Object.assign({id:d.id},d.data()));scheduleRender();},e=>onSubErr(e));
}
boot();
})();
</script>
